name: Clarify
options:
  bundleIdPrefix: com.eganai
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
packages:
  ClarifyKit:
    path: Packages/ClarifyKit
targets:
  Clarify:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes: ["Info.plist", "Clarify.entitlements"]
    dependencies:
      - package: ClarifyKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Clarify
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSMinimumSystemVersion: "26.0"
        NSHumanReadableCopyright: ""
        NSRemindersFullAccessUsageDescription: Clarify reads your inbox list and organizes reminders into GTD lists.
        NSCalendarsFullAccessUsageDescription: Clarify puts date-specific items on your calendar.
        NSContactsUsageDescription: Clarify looks up people named in your reminders to draft email and texts.
        NSAppleEventsUsageDescription: Clarify drafts and sends through Mail and Messages only after you approve.
        CFBundleURLTypes:
          - CFBundleURLName: com.eganai.clarify.command
            CFBundleURLSchemes: [clarify]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eganai.clarify
        PRODUCT_NAME: Clarify
        MARKETING_VERSION: "0.1.0"
        ENABLE_APP_SANDBOX: NO
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: App/Clarify.entitlements
      configs:
        Debug:
          # A separate bundle id keeps Debug permission grants from colliding
          # with an installed Release build.
          PRODUCT_BUNDLE_IDENTIFIER: com.eganai.clarify.debug
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
  ClarifyUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [UITests]
    dependencies:
      - target: Clarify
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eganai.clarify.uitests
        SWIFT_VERSION: "5.0"
        TEST_TARGET_NAME: Clarify
        GENERATE_INFOPLIST_FILE: YES
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
schemes:
  Clarify:
    build:
      targets:
        Clarify: all
        ClarifyUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [ClarifyUITests]
